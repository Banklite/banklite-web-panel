name: CI-CD web-panel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: Banklite/banklite-pipelines/.github/workflows/panel-pipeline.yml@main
    with:
      service-name: banklite-web-panel
    secrets: inherit
