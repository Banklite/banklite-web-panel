# Despliegue continuo del panel web.
#
# Se ejecuta al integrar cambios en main (o a mano desde la pestana Actions).
# Los jobs van en cadena con `needs`: si la aplicacion no compila, no hay imagen ni despliegue.
#
#   compilacion -> reutiliza ci.yml
#   imagen      -> construye la imagen y la publica en GitHub Container Registry
#   despliegue  -> avisa al hosting con el Deploy Hook guardado en GitHub Secrets
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  compilacion:
    name: CI
    uses: ./.github/workflows/ci.yml

  imagen:
    name: Publica la imagen Docker
    needs: compilacion
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Descarga el codigo
        uses: actions/checkout@v4

      - name: Nombre de la imagen en minusculas (lo exige el registro)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/banklite-web-panel" >> "$GITHUB_ENV"

      - name: Inicia sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construye y publica la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  despliegue:
    name: Despliegue
    needs: imagen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispara el despliegue
        env:
          # El Deploy Hook es una credencial: vive en Settings > Secrets and variables > Actions.
          HOOK: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::Sin DEPLOY_HOOK_URL: el hosting despliega por su integracion con GitHub."
            exit 0
          fi
          curl --fail --silent --show-error "$HOOK" > /dev/null
          echo "Despliegue solicitado para banklite-web-panel (${GITHUB_SHA::7})"
